# 데이터 수집 → 빌드 → Cloudflare Pages 배포
# 필요한 Secrets: MOLIT_SERVICE_KEY, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
name: build-and-deploy

on:
  schedule:
    - cron: "17 0 16 * *"   # 매월 16일 09:17 KST — 전월 실거래 갱신 이후
    - cron: "17 0 * * 1"    # 매주 월요일 09:17 KST — 최근 3개월 재수집
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "observablehq.config.js", "package.json", ".github/workflows/deploy.yml"]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OBSERVABLE_TELEMETRY_DISABLE: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # 실거래 캐시: 지난 실행에서 받은 달은 다시 받지 않는다
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: Fetch MOLIT
        env:
          MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
        run: python scripts/fetch_molit.py
      - name: Fetch KB
        run: python scripts/fetch_kb.py
        continue-on-error: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run clean && npm run build

      - name: Check file sizes (Cloudflare Pages 25 MiB/파일)
        run: find dist -type f -size +24M -print -exec false {} +

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=apt-insight --branch=main
